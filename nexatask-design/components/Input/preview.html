<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
  .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:24px;font-family:var(--font-sans);background:var(--surface-page);}
  .field{display:flex;flex-direction:column;gap:6px;}
  label{font-size:13px;font-weight:700;color:var(--ink);}
  label .req{color:var(--status-danger-ink);}
  .box{display:flex;align-items:center;background:var(--surface-input);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:11px 14px;}
  .box input{border:0;outline:0;background:transparent;font-family:var(--font-sans);font-size:14px;color:var(--ink);width:100%;}
  .box input::placeholder{color:var(--ink-tertiary);}
  .hint{font-size:12px;color:var(--ink-secondary);}
  .box.hover{border-color:var(--border-strong);}
  .box.focus{border-color:var(--focus-ring);outline:2px solid var(--focus-ring);outline-offset:1px;}
  .box.filled{background:var(--surface-card-hover);}
  .box.disabled{background:var(--surface-input-disabled);}
  .box.disabled input{color:var(--ink-tertiary);}
  .box.error{border-color:var(--status-danger-ink);}
  .hint.error{color:var(--status-danger-ink);}
</style>
<div class="wrap">
  <div class="field"><label>Label <span class="req">*</span></label>
    <div class="box"><input placeholder="Placeholder"></div>
    <span class="hint">Info message</span></div>
  <div class="field"><label>Label <span class="req">*</span></label>
    <div class="box hover"><input placeholder="Placeholder" value="Hovered field"></div>
    <span class="hint">Info message</span></div>
  <div class="field"><label>Label <span class="req">*</span></label>
    <div class="box focus"><input placeholder="Placeholder" value="Focused"></div>
    <span class="hint">Info message</span></div>
  <div class="field"><label>Label <span class="req">*</span></label>
    <div class="box filled"><input value="Filled value"></div>
    <span class="hint">Info message</span></div>
  <div class="field"><label>Label</label>
    <div class="box disabled"><input placeholder="Inactive" disabled></div>
  </div>
  <div class="field"><label>Label <span class="req">*</span></label>
    <div class="box error"><input value="Wrong format"></div>
    <span class="hint error">This field is required</span></div>
</div>
